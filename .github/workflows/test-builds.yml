name: Test builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      - run: npm test
      - run: npm run test:features
      - run: npm run test:polish
      - run: npm run test:advanced
      - run: npm run test:background
      - name: Package unsigned Windows x64 test builds
        if: runner.os == 'Windows'
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package unsigned Mac ARM64 CI test builds
        if: runner.os == 'macOS'
        run: npm run build:mac:test
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ARCHIVO_APP_EXECUTABLE = Join-Path $PWD 'dist\win-unpacked\Archivo Fork.exe'
          npm run test:features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:polish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:advanced
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:background
          exit $LASTEXITCODE
      - name: Verify packaged Mac application
        if: runner.os == 'macOS'
        run: |
          export ARCHIVO_APP_EXECUTABLE="$PWD/dist/mac-arm64/Archivo Fork.app/Contents/MacOS/Archivo Fork"
          npm run test:features
          npm run test:polish
          npm run test:advanced
          npm run test:background
      - name: Upload installable builds
        uses: actions/upload-artifact@v4
        with:
          name: archivo-fork-${{ runner.os }}-1.5.0-beta.2
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          retention-days: 30
          if-no-files-found: error
